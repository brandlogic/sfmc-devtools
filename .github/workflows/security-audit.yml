name: Security audit

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]
    schedule:
        - cron: '23 7 * * 1'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    audit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci --ignore-scripts
            - run: npm audit --omit=dev --audit-level=moderate
